<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="180" viewBox="0 0 1060 180">
  <style>
    .title  { font: 700 18px 'Segoe UI', system-ui, sans-serif; fill: #1B2B3B; }
    .box    { fill: #EEF4FF; stroke: #2558C4; stroke-width: 1.5; }
    .box-export { fill: #E8F8F5; stroke: #0E7490; stroke-width: 1.5; }
    .box-manual { fill: #F4F5F7; stroke: #8A97A6; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .num    { font: 700 10px 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.06em; fill: #2558C4; }
    .num-export { font: 700 10px 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.06em; fill: #0E7490; }
    .num-manual { font: 700 10px 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.06em; fill: #6B7686; }
    .lbl    { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #1B2B3B; }
    .lbl-manual { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #4B5563; }
    .note   { font: 12px 'Segoe UI', system-ui, sans-serif; fill: #5B6E82; }
    .note-manual { font: 12px 'Segoe UI', system-ui, sans-serif; fill: #7A8494; }
    .arrow  { stroke: #2558C4; stroke-width: 1.5; }
    .arrow-manual { stroke: #8A97A6; stroke-width: 1.5; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2558C4"/>
    </marker>
    <marker id="ah-manual" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#8A97A6"/>
    </marker>
  </defs>

  <text class="title" x="20" y="28">AI-Map Mapping Workflow</text>

  <!-- 1. Ingest -->
  <rect class="box" x="20" y="48" width="155" height="96" rx="5"/>
  <text class="num"  x="34" y="68">01</text>
  <text class="lbl"  x="34" y="87">Ingest</text>
  <text class="note" x="34" y="106">Codes, descriptions</text>
  <text class="note" x="34" y="122">&amp; metadata</text>

  <line class="arrow" x1="175" y1="96" x2="191" y2="96" marker-end="url(#ah)"/>

  <!-- 2. AI Auto-Match -->
  <rect class="box" x="193" y="48" width="155" height="96" rx="5"/>
  <text class="num"  x="207" y="68">02</text>
  <text class="lbl"  x="207" y="87">AI Auto-Match</text>
  <text class="note" x="207" y="106">SNOMED CT or LOINC</text>
  <text class="note" x="207" y="122">concept candidates</text>

  <line class="arrow" x1="348" y1="96" x2="364" y2="96" marker-end="url(#ah)"/>

  <!-- 3. Review -->
  <rect class="box" x="366" y="48" width="155" height="96" rx="5"/>
  <text class="num"  x="380" y="68">03</text>
  <text class="lbl"  x="380" y="87">Review</text>
  <text class="note" x="380" y="106">Approve, reject or</text>
  <text class="note" x="380" y="122">defer each mapping</text>

  <line class="arrow" x1="521" y1="96" x2="537" y2="96" marker-end="url(#ah)"/>

  <!-- 4. Publish (= finalise & version, inside AI-Map) -->
  <rect class="box" x="539" y="48" width="155" height="96" rx="5"/>
  <text class="num"  x="553" y="68">04</text>
  <text class="lbl"  x="553" y="87">Publish</text>
  <text class="note" x="553" y="106">Finalise &amp; version</text>
  <text class="note" x="553" y="122">the mapping</text>

  <line class="arrow" x1="694" y1="96" x2="710" y2="96" marker-end="url(#ah)"/>

  <!-- 5. Export (teal = delivery to clinical systems) -->
  <rect class="box-export" x="712" y="48" width="155" height="96" rx="5"/>
  <text class="num-export" x="726" y="68">05</text>
  <text class="lbl"        x="726" y="87">Export</text>
  <text class="note"       x="726" y="106">Excel, CSV/TSV, or</text>
  <text class="note"       x="726" y="122">FHIR ConceptMap</text>

  <line class="arrow-manual" x1="867" y1="96" x2="883" y2="96" marker-end="url(#ah-manual)"/>

  <!-- 6. Upload to FHIR endpoint (dashed = manual step, outside AI-Map) -->
  <rect class="box-manual" x="885" y="48" width="155" height="96" rx="5"/>
  <text class="num-manual" x="899" y="68">06</text>
  <text class="lbl-manual" x="899" y="87">Upload</text>
  <text class="note-manual" x="899" y="106">ConceptMap.json to a</text>
  <text class="note-manual" x="899" y="122">FHIR server (manual)</text>
</svg>
